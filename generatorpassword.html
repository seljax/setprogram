<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator :: SelJax</title>
    <link href="https://fonts.googleapis.com/css?family=Abel" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            font-family: 'Abel', 'Courier New', monospace;
            background: #0b0e14;
            color: #a0f0a0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at 20% 30%, #0f1a0f 0%, #030503 100%);
            position: relative;
        }

        /* эффект сканирующей линии */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                rgba(0, 255, 0, 0.015) 0px,
                rgba(0, 255, 0, 0.015) 2px,
                transparent 2px,
                transparent 8px);
            pointer-events: none;
            z-index: 999;
        }

        /* ----- ЭФФЕКТ ДОЖДЯ ----- */
        .rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 0, 0.03) 0,
                rgba(0, 255, 0, 0.06) 2px,
                transparent 4px
            );
            animation: rain 10s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes rain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        /* ----- ЛОГОТИП (правый нижний угол) ----- */
        .logo {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .logo:hover {
            opacity: 1;
        }

        .logo img {
            max-height: 40px;
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.2));
        }

        /* ----- КНОПКА НАЗАД ----- */
        .back-btn {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 1000;
            color: #4a7a4a;
            text-decoration: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
            border: 1px solid #1f3a2a;
            padding: 8px 20px;
            border-radius: 4px;
        }

        .back-btn:hover {
            color: #b0f0b0;
            border-color: #4a8a4a;
            box-shadow: 0 0 20px rgba(0, 60, 0, 0.2);
        }

        .back-btn::before {
            content: '← ';
            color: #3a7a3a;
        }

        /* ----- ЗАГОЛОВОК "Архив SelJax" (правый верхний угол) ----- */
        .header-title {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 1000;
            pointer-events: none;
        }

        .matrix-text {
            color: #0f0;
            font-size: 28px;
            font-family: 'Courier New', monospace;
            position: relative;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .matrix-text::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: glitch 2s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-2px, -2px);
            color: #0f0;
            text-shadow: 0 0 5px #0f0, 0 0 15px #0f0;
        }

        @keyframes glitch {
            0%, 100% {
                clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
                transform: translate(0);
            }
            33% {
                clip-path: polygon(0 0, 100% 0, 100% 15%, 0 15%);
                transform: translate(-3px, -3px);
            }
            66% {
                clip-path: polygon(0 85%, 100% 85%, 100% 100%, 0 100%);
                transform: translate(3px, 3px);
            }
        }

        /* ----- ОСНОВНОЙ КОНТЕЙНЕР ----- */
        .generator-container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px;
            max-width: 560px;
            width: 100%;
        }

        .generator-title {
            font-size: 40px;
            font-weight: 700;
            color: #0f0;
            text-shadow: 0 0 20px #0f0, 0 0 40px #0f0, 0 0 80px rgba(0, 255, 0, 0.2);
            font-family: 'Courier New', monospace;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .generator-title .highlight {
            color: #80d080;
            text-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .generator-subtitle {
            font-size: 14px;
            color: #4f7a4f;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .generator-subtitle::before {
            content: '# ';
            color: #3a7a3a;
        }

        /* ----- ПОЛЕ С ПАРОЛЕМ ----- */
        .password-display {
            background: rgba(10, 18, 24, 0.9);
            border: 1px solid #1f3a2a;
            padding: 18px 24px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .password-display:hover {
            border-color: #3a7a3a;
        }

        .password-display .password-text {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            color: #b0f0b0;
            letter-spacing: 2px;
            word-break: break-all;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
            user-select: all;
            flex: 1;
            text-align: left;
            min-height: 36px;
        }

        .password-display .copy-btn {
            background: transparent;
            border: 1px solid #2a4a2a;
            color: #6a9a6a;
            padding: 6px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            border-radius: 4px;
            white-space: nowrap;
        }

        .password-display .copy-btn:hover {
            background: #1a3a1a;
            border-color: #4a8a4a;
            color: #b0f0b0;
        }

        .password-display .copy-btn.copied {
            border-color: #4a9a4a;
            color: #7aaa7a;
        }

        /* ----- НАСТРОЙКИ ----- */
        .settings {
            background: rgba(12, 20, 28, 0.85);
            border: 1px solid #1f3a2a;
            padding: 24px 28px;
            margin-bottom: 30px;
            border-radius: 4px;
            text-align: left;
        }

        .setting-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(26, 42, 42, 0.5);
        }

        .setting-group:last-child {
            border-bottom: none;
        }

        .setting-group label {
            color: #8aba8a;
            font-size: 15px;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-group label .label-icon {
            color: #3a7a3a;
        }

        /* ----- СЛАЙДЕР ДЛИНЫ ----- */
        .length-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .length-control input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 160px;
            height: 4px;
            background: #1a2a2a;
            border-radius: 2px;
            outline: none;
            transition: 0.3s;
        }

        .length-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #3a7a3a;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid #5aaa5a;
            box-shadow: 0 0 10px rgba(0, 80, 0, 0.2);
        }

        .length-control input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #3a7a3a;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid #5aaa5a;
        }

        .length-control .length-value {
            font-family: 'Courier New', monospace;
            font-size: 20px;
            color: #b0f0b0;
            min-width: 40px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
        }

        /* ----- ЧЕКБОКСЫ (стилизованные) ----- */
        .setting-group input[type="checkbox"] {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #0a1218;
            border: 1px solid #2a4a2a;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .setting-group input[type="checkbox"]:checked {
            background: #1a4a1a;
            border-color: #4a9a4a;
        }

        .setting-group input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7aaa7a;
            font-size: 14px;
        }

        .setting-group input[type="checkbox"]:hover {
            border-color: #4a8a4a;
        }

        /* ----- КНОПКА ГЕНЕРАЦИИ ----- */
        .generate-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid #2a6a2a;
            background: transparent;
            color: #7aaa7a;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.3s;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .generate-btn:hover {
            background: #1a4a1a;
            border-color: #4a9a4a;
            color: #a0f0a0;
            box-shadow: 0 0 30px rgba(0, 80, 0, 0.2);
        }

        .generate-btn:active {
            transform: scale(0.97);
        }

        /* ----- ТЕРМИНАЛЬНАЯ СТРОКА ----- */
        .terminal-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: #4a7a4a;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #4a7a4a;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ----- АДАПТИВНОСТЬ ----- */
        @media (max-width: 720px) {
            .generator-title {
                font-size: 28px;
                letter-spacing: 4px;
            }
            .password-display .password-text {
                font-size: 18px;
            }
            .settings {
                padding: 18px 16px;
            }
            .setting-group {
                flex-wrap: wrap;
                gap: 8px;
            }
            .length-control input[type="range"] {
                width: 100px;
            }
            .matrix-text {
                font-size: 20px;
            }
            .header-title {
                top: 15px;
                right: 20px;
            }
            .back-btn {
                top: 15px;
                left: 20px;
                font-size: 12px;
                padding: 6px 14px;
            }
            .logo img {
                max-height: 30px;
            }
            .logo {
                bottom: 20px;
                right: 20px;
            }
        }

        @media (max-width: 480px) {
            .generator-title {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .generator-subtitle {
                font-size: 12px;
                letter-spacing: 2px;
                margin-bottom: 20px;
            }
            .password-display {
                padding: 14px 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .password-display .password-text {
                font-size: 16px;
                text-align: center;
                width: 100%;
            }
            .password-display .copy-btn {
                font-size: 11px;
                padding: 4px 12px;
            }
            .settings {
                padding: 14px 12px;
            }
            .setting-group {
                padding: 8px 0;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .setting-group label {
                font-size: 13px;
            }
            .length-control {
                width: 100%;
                justify-content: space-between;
            }
            .length-control input[type="range"] {
                width: 120px;
            }
            .generate-btn {
                font-size: 13px;
                padding: 12px;
                letter-spacing: 2px;
            }
            .matrix-text {
                font-size: 16px;
            }
            .header-title {
                top: 12px;
                right: 15px;
            }
            .back-btn {
                top: 12px;
                left: 15px;
                font-size: 10px;
                padding: 4px 12px;
            }
            .logo img {
                max-height: 24px;
            }
            .logo {
                bottom: 15px;
                right: 15px;
            }
            .terminal-line {
                font-size: 11px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ЭФФЕКТ ДОЖДЯ ===== -->
    <div class="rain"></div>

    <!-- ===== КНОПКА НАЗАД ===== -->
    <a href="index.html" class="back-btn">Назад</a>

    <!-- ===== ЗАГОЛОВОК "Архив SelJax" ===== -->
    <div class="header-title">
        <div class="matrix-text" data-text="Архив SelJax">Архив SelJax</div>
    </div>

    <!-- ===== ЛОГОТИП ===== -->
    <div class="logo">
        <img src="images/seljax_logo.png" alt="Seljax Logo">
    </div>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <div class="generator-container">
        <div class="generator-title">
            <span class="highlight">#</span> PASSWORD <span class="highlight">#</span>
        </div>
        <div class="generator-subtitle">secure password generator</div>

        <!-- Поле с паролем -->
        <div class="password-display">
            <span class="password-text" id="passwordDisplay">••••••••••••</span>
            <button class="copy-btn" id="copyBtn" onclick="copyPassword()">Копировать</button>
        </div>

        <!-- Настройки -->
        <div class="settings">
            <div class="setting-group">
                <label>
                    <span class="label-icon">◆</span> Длина
                </label>
                <div class="length-control">
                    <input type="range" id="lengthSlider" min="4" max="64" value="16">
                    <span class="length-value" id="lengthValue">16</span>
                </div>
            </div>

            <div class="setting-group">
                <label>
                    <span class="label-icon">◆</span> Спецсимволы
                    <span style="color:#4a6a4a;font-size:11px;font-weight:300;">!@#$%^&*</span>
                </label>
                <input type="checkbox" id="includeSymbols" checked>
            </div>

            <div class="setting-group">
                <label>
                    <span class="label-icon">◆</span> Заглавные буквы
                </label>
                <input type="checkbox" id="includeUppercase" checked>
            </div>
        </div>

        <!-- Кнопка генерации -->
        <button class="generate-btn" onclick="generatePassword()">⟳ Сгенерировать</button>

        <!-- Терминальная строка -->
        <div class="terminal-line">
            <span>root@archive:~$</span>
            <span>./generate.sh --secure</span>
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        // ================================================================
        // ГЕНЕРАТОР ПАРОЛЕЙ
        // ================================================================
        const passwordDisplay = document.getElementById('passwordDisplay');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const includeSymbols = document.getElementById('includeSymbols');
        const includeUppercase = document.getElementById('includeUppercase');
        const copyBtn = document.getElementById('copyBtn');

        // Обновление значения длины
        lengthSlider.addEventListener('input', function() {
            lengthValue.textContent = this.value;
        });

        // Основная функция генерации
        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            const useSymbols = includeSymbols.checked;
            const useUppercase = includeUppercase.checked;

            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let chars = lowercase + numbers;
            if (useUppercase) chars += uppercase;
            if (useSymbols) chars += symbols;

            if (!chars) {
                passwordDisplay.textContent = 'Ошибка: выберите хотя бы один тип символов';
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * chars.length);
                password += chars[randomIndex];
            }

            passwordDisplay.textContent = password;

            // Сбрасываем состояние кнопки копирования
            copyBtn.textContent = 'Копировать';
            copyBtn.classList.remove('copied');
        }

        // Копирование в буфер обмена
        function copyPassword() {
            const password = passwordDisplay.textContent;
            if (!password || password === '••••••••••••' || password.includes('Ошибка')) {
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(password).then(() => {
                    copyBtn.textContent = '✓ Скопировано!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'Копировать';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    fallbackCopy(password);
                });
            } else {
                fallbackCopy(password);
            }
        }

        // Резервный способ копирования
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                copyBtn.textContent = '✓ Скопировано!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = 'Копировать';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (e) {
                alert('Не удалось скопировать пароль. Выделите его вручную.');
            }
            document.body.removeChild(textarea);
        }

        // Генерация при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            generatePassword();
        });

        // Генерация по Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                generatePassword();
            }
        });

        // Проверка на наличие логотипа
        const logoImg = document.querySelector('.logo img');
        if (logoImg) {
            logoImg.addEventListener('error', function() {
                this.style.display = 'none';
                console.warn('Логотип не найден: images/seljax_logo.png');
            });
        }

        console.log('%c🔐 Password Generator loaded', 'color:#0f0;font-size:16px;');
        console.log('💡 Нажмите Enter для генерации нового пароля');
    </script>

</body>
</html>
